name: Mercati Screener

on:
  schedule:
    - cron: '*/30 7-22 * * 1-5'
    - cron: '0 0,1,2,3,4,5,6,23 * * *'
    - cron: '0 */2 * * 0,6'
  workflow_dispatch:

# Un run alla volta: se ne parte uno mentre l'altro gira, aspetta in coda
concurrency:
  group: mercati-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests yfinance

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY:  ${{ secrets.COINGECKO_API_KEY }}
        run: python screener.py

      - name: Persist state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json signals_log.json paper.json docs/data.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then echo "Nessuna modifica da salvare"; exit 0; fi
          git commit -m "chore: update screener state [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rifiutato (tentativo $i): riallineo e riprovo"
            git pull --rebase origin main || exit 1
            sleep 5
          done
          exit 1

name: Backtest

on:
  push:
    branches: [backtest]
    paths: ['backtest.py', '.github/workflows/backtest.yml']
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests yfinance pandas numpy
      - name: Backtest
        run: python backtest.py
      - name: Salva risultati
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backtest_results || true
          git diff --staged --quiet && exit 0
          git commit -m "backtest: risultati [skip ci]"
          git push
